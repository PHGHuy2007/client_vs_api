<!DOCTYPE html><html lang="vi"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Sinh viên - Client</title>
  <style>body {
  background-color: #f4f4f9;
  margin: 20px;
  font-family: Arial, sans-serif;
}

.container {
  background: #fff;
  border-radius: 8px;
  max-width: 800px;
  margin: auto;
  padding: 20px;
  box-shadow: 0 0 10px #0000001a;
}

.form-group {
  margin-bottom: 12px;
}

.form-group label {
  margin-bottom: 4px;
  font-weight: bold;
  display: block;
}

.form-group input {
  box-sizing: border-box;
  width: 100%;
  padding: 8px;
}

button {
  color: #fff;
  cursor: pointer;
  background: #007bff;
  border: none;
  border-radius: 4px;
  padding: 10px 15px;
}

button:hover {
  background: #0056b3;
}

table {
  border-collapse: collapse;
  width: 100%;
  margin-top: 20px;
}

table, th, td {
  border: 1px solid #ddd;
}

th, td {
  text-align: left;
  padding: 10px;
}

th {
  background: #f2f2f2;
}

.alert {
  border-radius: 4px;
  margin-bottom: 15px;
  padding: 10px;
  display: none;
}

.alert-success {
  color: #155724;
  background: #d4edda;
}

.alert-danger {
  color: #721c24;
  background: #f8d7da;
}
</style>
</head>
<body>
  <div class="container">
    <h2>Thêm Sinh Viên Mới</h2>
    <div id="alertBox" class="alert"></div>
    
    <form id="studentForm">
      <div class="form-group">
        <label for="rollNumber">Mã Sinh Viên:</label>
        <input type="text" id="rollNumber" required="">
      </div>
      <div class="form-group">
        <label for="fullName">Họ và Tên:</label>
        <input type="text" id="fullName" required="">
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" required="">
      </div>
      <div class="form-group">
        <label for="phone">Số Điện Thoại:</label>
        <input type="text" id="phone" required="">
      </div>
      <button type="submit">Lưu Sinh Viên</button>
    </form>

    <hr style="margin-top: 30px">

    <h2>Danh Sách Sinh Viên</h2>
    <table>
      <thead>
        <tr>
          <th>Mã SV</th>
          <th>Họ và Tên</th>
          <th>Email</th>
          <th>Số Điện Thoại</th>
        </tr>
      </thead>
      <tbody id="studentTableBody">
        <!-- Dữ liệu sẽ được chèn tự động từ TypeScript -->
      </tbody>
    </table>
  </div>

  <script type="module" src="/student-client.c9112ede.js"></script>


</body></html>
